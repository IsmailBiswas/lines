[package]
name = "resume-tracker"
version = "0.1.0"
description = "Local versioned resume editor"
authors = ["you"]
edition = "2021"

[lib]
name = "resume_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
printpdf = "0.7"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
